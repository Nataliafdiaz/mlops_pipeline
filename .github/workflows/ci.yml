name: CI Avance 3

on:
  push:
    branches: [ developer ]
  pull_request:
    branches: [ developer ]

jobs:
  test-avance-3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r avance_3/requirements.txt

      - name: Ejecutar preparación de datos
        run: python avance_3/src/prepare_data.py

      - name: Ejecutar análisis de drift
        run: python avance_3/src/drift.py